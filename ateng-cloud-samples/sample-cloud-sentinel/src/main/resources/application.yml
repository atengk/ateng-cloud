server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    sentinelPanorama:
      enabled: true

spring:
  application:
    name: sample-cloud-sentinel
  config:
    import:
      # 弹性探测本地真实微服务环境配置，存在时增量合并，不存在时静默跳过守护 CI 离线自洽
      - "optional:classpath:application-local.yml"
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    sentinel:
      transport:
        port: 8719
        dashboard: ""
      eager: true

ateng:
  boot:
    web:
      shutdown:
        enabled: false
  cloud:
    sentinel:
      enabled: true
      block-handler:
        enabled: true
        http-status-align: true
      url-clean:
        enabled: true
        number-replacement: "{id}"
        uuid-replacement: "{uuid}"
        exclude-patterns:
          - "/actuator/**"
          - "/v3/api-docs/**"
          - "/sample/cloud/sentinel/security/public/**"
      origin-parser:
        origin-header: "X-Origin-Service"
        gateway-header: "X-Gateway-From"
        default-origin: "gateway"
        enable-client-ip-fallback: true
      block-advice:
        enabled: true
        http-status-align: true
      endpoint:
        enabled: true
