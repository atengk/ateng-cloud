server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    sentinelPanorama:
      enabled: true

spring:
  application:
    name: sample-cloud-sentinel
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    sentinel:
      transport:
        port: 8719
        dashboard: ""
      eager: true

ateng:
  cloud:
    sentinel:
      enabled: true
      block-handler:
        enabled: true
        http-status-align: true
      url-clean:
        enabled: true
        number-replacement: "{id}"
        uuid-replacement: "{uuid}"
        exclude-patterns:
          - "/actuator/**"
          - "/v3/api-docs/**"
      origin-parser:
        origin-header: "X-Origin-Service"
        gateway-header: "X-Gateway-From"
        default-origin: "gateway"
        enable-client-ip-fallback: true
      block-advice:
        enabled: true
        http-status-align: true
      endpoint:
        enabled: true
