server:
  port: 0

spring:
  application:
    name: sample-cloud-gateway
  main:
    web-application-type: reactive
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    gateway:
      routes:
        - id: mock-route
          uri: forward:/
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1

ateng:
  cloud:
    gateway:
      enabled: true
      max-in-memory-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
