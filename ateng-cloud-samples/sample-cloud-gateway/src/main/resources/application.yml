server:
  port: 0

spring:
  application:
    name: sample-cloud-gateway
  main:
    web-application-type: reactive
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    gateway:
      routes:
        - id: mock-hello
          uri: forward:/mock/hello
          predicates:
            - Path=/api/mock/hello
        - id: mock-echo-headers
          uri: forward:/mock/echo-headers
          predicates:
            - Path=/api/mock/echo-headers
        - id: mock-fallback
          uri: forward:/mock/hello
          predicates:
            - Path=/api/**

ateng:
  cloud:
    gateway:
      enabled: true
      max-in-memory-size: 2MB
      security:
        enabled: true
        trusted-proxy-count: 1
        ip-blacklist:
          - "192.168.100.1"
          - "10.99.0.0/16"

management:
  endpoints:
    web:
      exposure:
        include: health,info
