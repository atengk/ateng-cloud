server:
  port: 0

spring:
  application:
    name: sample-cloud-gateway
  main:
    web-application-type: reactive
  config:
    import:
      # 弹性探测本地真实配置文件；物理不存在时自动静默忽略，保障 CI 离线自洽
      - "optional:classpath:application-local.yml"
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    loadbalancer:
      cache:
        ttl: 3s
    gateway:
      routes:
        - id: mock-open-data
          uri: forward:/mock/open-data
          predicates:
            - Path=/api/open/data
        - id: auth-login
          uri: forward:/auth/login
          predicates:
            - Path=/api/auth/login
        - id: mock-hello
          uri: forward:/mock/hello
          predicates:
            - Path=/api/mock/hello
        - id: mock-echo-headers
          uri: forward:/mock/echo-headers
          predicates:
            - Path=/api/mock/echo-headers
        - id: mock-protected
          uri: forward:/mock/protected
          predicates:
            - Path=/api/mock/protected
        - id: mock-retry-test
          uri: forward:/mock/retry-counter
          predicates:
            - Path=/api/mock/retry-counter
          filters:
            - AtengRetry=1
        - id: mock-upload-echo
          uri: forward:/mock/upload-echo
          predicates:
            - Path=/api/mock/upload-echo
        - id: mock-sse
          uri: forward:/mock/sse
          predicates:
            - Path=/api/mock/sse
        - id: mock-rate-limit
          uri: forward:/mock/simulate-rate-limit
          predicates:
            - Path=/api/mock/simulate-rate-limit
        - id: mock-fallback
          uri: forward:/mock/hello
          predicates:
            - Path=/api/**

ateng:
  cloud:
    nacos:
      drain-timeout: 20ms
    gateway:
      enabled: true
      max-in-memory-size: 2MB
      access-log:
        enabled: true
        slow-threshold: 3s
      sign:
        enabled: true
        timestamp-threshold: 5m
        include-paths:
          - "/api/open/**"
      security:
        enabled: true
        trusted-proxy-count: 1
        exclude-paths:
          - "/api/open/**"
          - "/mock/open-data"
          - "/api/mock/hello"
          - "/api/mock/echo-headers"
          - "/mock/echo-headers"
          - "/api/auth/**"
          - "/auth/**"
          - "/mock/hello"
          - "/mock/business-error"
          - "/mock/server-error"
          - "/api/mock/sse"
          - "/api/mock/upload-echo"
          - "/api/mock/simulate-rate-limit"
          - "/api/mock/retry-counter"
          - "/mock/**"
          - "/dynamic/**"
        ip-blacklist:
          - "192.168.100.1"
          - "10.99.0.0/16"
      tenant:
        enabled: true
        allow-header: false

sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  same-token:
    project-key: ateng-cloud-test-secret-key-123456

management:
  endpoints:
    web:
      exposure:
        include: health,info
