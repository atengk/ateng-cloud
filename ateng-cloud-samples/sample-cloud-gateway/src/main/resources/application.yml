server:
  port: 0

spring:
  application:
    name: sample-cloud-gateway
  main:
    web-application-type: reactive
  config:
    import:
      # 弹性探测本地真实配置文件；物理不存在时自动静默忽略，保障 CI 离线自洽
      - "optional:classpath:application-local.yml"
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    loadbalancer:
      cache:
        ttl: 3s
    gateway:
      routes:
        - id: open-sync-order
          uri: forward:/sample/cloud/gateway/security/open/merchant/sync-order
          predicates:
            - Path=/api/open/merchant/sync-order
        - id: open-query-order
          uri: forward:/sample/cloud/gateway/security/open/merchant/query-order
          predicates:
            - Path=/api/open/merchant/query-order
        - id: security-payload-guard
          uri: forward:/sample/cloud/gateway/security/payload-guard
          predicates:
            - Path=/api/security/payload-guard
        - id: security-ip-guard
          uri: forward:/sample/cloud/gateway/security/ip-guard
          predicates:
            - Path=/api/security/ip-guard
        - id: security-path-guard
          uri: forward:/sample/cloud/gateway/security/path-guard
          predicates:
            - Path=/api/security/path-guard
        - id: security-inspect-headers
          uri: forward:/sample/cloud/gateway/security/inspect-edge-headers
          predicates:
            - Path=/api/security/inspect-edge-headers
        - id: auth-login
          uri: forward:/sample/cloud/gateway/auth/login
          predicates:
            - Path=/api/auth/login
        - id: auth-user-info
          uri: forward:/sample/cloud/gateway/auth/user-info
          predicates:
            - Path=/api/auth/user-info
        - id: auth-inspect-context
          uri: forward:/sample/cloud/gateway/auth/inspect-context
          predicates:
            - Path=/api/auth/inspect-context
        - id: auth-logout
          uri: forward:/sample/cloud/gateway/auth/logout
          predicates:
            - Path=/api/auth/logout
        - id: order-dispatch
          uri: forward:/sample/cloud/gateway/route/order-dispatch
          predicates:
            - Path=/api/order/dispatch
        - id: order-fallback
          uri: forward:/sample/cloud/gateway/route/canary-fallback
          predicates:
            - Path=/api/order/fallback
        - id: route-definitions
          uri: forward:/sample/cloud/gateway/route/definitions
          predicates:
            - Path=/api/route/definitions
        - id: route-refresh
          uri: forward:/sample/cloud/gateway/route/refresh
          predicates:
            - Path=/api/route/refresh
        - id: resilience-query-inventory
          uri: forward:/sample/cloud/gateway/resilience/query-inventory
          predicates:
            - Path=/api/resilience/query-inventory
          filters:
            - AtengRetry=1
        - id: resilience-create-order
          uri: forward:/sample/cloud/gateway/resilience/create-order
          predicates:
            - Path=/api/resilience/create-order
          filters:
            - AtengRetry=1
        - id: resilience-seckill-spike
          uri: forward:/sample/cloud/gateway/resilience/seckill-spike
          predicates:
            - Path=/api/resilience/seckill-spike
        - id: resilience-node-restart
          uri: forward:/sample/cloud/gateway/resilience/simulate-node-restart
          predicates:
            - Path=/api/resilience/simulate-node-restart
        - id: resilience-order-events
          uri: forward:/sample/cloud/gateway/resilience/order-events
          predicates:
            - Path=/api/resilience/order-events
        - id: resilience-business-error
          uri: forward:/sample/cloud/gateway/resilience/business-error
          predicates:
            - Path=/api/resilience/business-error
        - id: resilience-server-error
          uri: forward:/sample/cloud/gateway/resilience/server-error
          predicates:
            - Path=/api/resilience/server-error
        - id: resilience-satoken-not-login
          uri: forward:/sample/cloud/gateway/resilience/satoken/not-login
          predicates:
            - Path=/api/resilience/satoken/not-login
        - id: resilience-satoken-not-permission
          uri: forward:/sample/cloud/gateway/resilience/satoken/not-permission
          predicates:
            - Path=/api/resilience/satoken/not-permission

ateng:
  cloud:
    nacos:
      drain-timeout: 20ms
    gateway:
      enabled: true
      max-in-memory-size: 2MB
      access-log:
        enabled: true
        slow-threshold: 3s
        include-query: true
        mask-keys:
          - customSecret
      sign:
        enabled: true
        body-enabled: true
        timestamp-threshold: 5m
        include-paths:
          - "/api/open/**"
      security:
        enabled: true
        trusted-proxy-count: 1
        exclude-paths:
          - "/api/open/**"
          - "/api/security/**"
          - "/sample/cloud/gateway/security/**"
          - "/api/resilience/**"
          - "/sample/cloud/gateway/resilience/**"
          - "/api/lb/**"
          - "/api/auth/login"
          - "/sample/cloud/gateway/auth/login"
          - "/api/auth/inspect-context"
          - "/sample/cloud/gateway/auth/inspect-context"
          - "/api/auth/logout"
          - "/sample/cloud/gateway/auth/logout"
          - "/api/order/**"
          - "/sample/cloud/gateway/route/**"
          - "/api/route/**"
          - "/dynamic/**"
          - "/actuator/**"
        ip-blacklist:
          - "192.168.100.1"
          - "10.99.0.0/16"
      tenant:
        enabled: true
        allow-header: false

sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  same-token:
    project-key: ateng-cloud-test-secret-key-123456

management:
  endpoints:
    web:
      exposure:
        include: health,info,atengGateway
