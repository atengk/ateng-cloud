server:
  port: 0

spring:
  application:
    name: sample-cloud-gateway
  main:
    web-application-type: reactive
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    gateway:
      routes:
        - id: auth-login
          uri: forward:/auth/login
          predicates:
            - Path=/api/auth/login
        - id: mock-hello
          uri: forward:/mock/hello
          predicates:
            - Path=/api/mock/hello
        - id: mock-echo-headers
          uri: forward:/mock/echo-headers
          predicates:
            - Path=/api/mock/echo-headers
        - id: mock-protected
          uri: forward:/mock/protected
          predicates:
            - Path=/api/mock/protected
        - id: mock-fallback
          uri: forward:/mock/hello
          predicates:
            - Path=/api/**

ateng:
  cloud:
    gateway:
      enabled: true
      max-in-memory-size: 2MB
      security:
        enabled: true
        trusted-proxy-count: 1
        exclude-paths:
          - "/api/mock/hello"
          - "/api/mock/echo-headers"
          - "/mock/echo-headers"
          - "/api/auth/**"
          - "/auth/**"
          - "/mock/hello"
          - "/mock/business-error"
          - "/mock/server-error"
          - "/dynamic/**"
        ip-blacklist:
          - "192.168.100.1"
          - "10.99.0.0/16"
      tenant:
        enabled: true
        allow-header: false

sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  same-token:
    project-key: ateng-cloud-test-secret-key-123456

management:
  endpoints:
    web:
      exposure:
        include: health,info
