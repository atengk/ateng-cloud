server:
  port: 0

spring:
  application:
    name: sample-cloud-traffic-gray
  config:
    import:
      - optional:classpath:application-local.yml
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    loadbalancer:
      cache:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,traffic
  endpoint:
    traffic:
      enabled: true

ateng:
  boot:
    web:
      shutdown:
        enabled: false
  cloud:
    traffic:
      enabled: true
      fallback-to-default: true
      strict-lane: false
      lane-continuity: true
      rules:
        - id: "rule-local-canary-fallback"
          name: "本地静态保底灰度规则"
          priority: 100
          target-tag: "v2"
          condition-relation: AND
          conditions:
            - field-source: HEADER
              field-name: "X-Local-Canary"
              operator: EXACT
              expected-value: "enabled"
      nacos:
        enabled: true
        group: DEFAULT_GROUP
        global-data-id: traffic-rules.json
        prefer-app-rule: true
