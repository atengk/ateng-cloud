# ==============================================================================
# ateng-cloud 流量治理场景工程本地真实环境联调配置模板
# 注意：application-local.yml 已被 .gitignore 全局物理忽略，严禁向 Git 提交任何真实凭据！
# 使用方式：复制为 application-local.yml，按需填写真实 Nacos 地址与凭据
# 激活方式：启动时添加环境变量 SPRING_PROFILES_ACTIVE=local 或 VM 参数 -Dspring.profiles.active=local
# ==============================================================================
spring:
  config:
    activate:
      on-profile: local
    import:
      - "optional:nacos:${spring.application.name}.yaml"
  cloud:
    nacos:
      server-addr: YOUR_NACOS_SERVER:8848
      username: YOUR_NACOS_USERNAME
      password: YOUR_NACOS_PASSWORD
      discovery:
        enabled: true
        namespace: YOUR_NAMESPACE
      config:
        enabled: true
        namespace: YOUR_NAMESPACE
        group: DEFAULT_GROUP
