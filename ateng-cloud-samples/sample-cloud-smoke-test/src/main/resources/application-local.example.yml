# ==============================================================================
# 本地真实 Nacos 服务注册与发现配置模板（请将本文件复制为 application-local.yml 并填写真实凭据）
# 注意：application-local.yml 已被 .gitignore 全局物理忽略，严禁向 Git 提交任何真实凭据！
# 激活方式：启动时添加环境变量 SPRING_PROFILES_ACTIVE=local 或 VM 参数 -Dspring.profiles.active=local
# ==============================================================================
spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      server-addr: YOUR_NACOS_SERVER:8848
      username: YOUR_NACOS_USERNAME
      password: YOUR_NACOS_PASSWORD
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
        enabled: true
      config:
        server-addr: ${spring.cloud.nacos.server-addr}
        enabled: true

dubbo:
  registry:
    address: nacos://${spring.cloud.nacos.server-addr}
    username: ${spring.cloud.nacos.username:}
    password: ${spring.cloud.nacos.password:}
