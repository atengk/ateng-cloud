test:
  server:
    port: 8080
  unreachable:
    port: 59999

server:
  port: 0

spring:
  application:
    name: sample-cloud-feign
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

ateng:
  boot:
    web:
      shutdown:
        enabled: false
  cloud:
    feign:
      enabled: true
      httpclient:
        max-connections: 200
        max-connections-per-route: 50
        time-to-live: 900s
        max-idle-time: 60s
        evict-idle-connections-interval: 60s
        evict-expired-connections: true
        connection-timeout: 2000ms
        socket-timeout: 5000ms
      retry:
        enabled: true
        period: 50ms
        max-period: 200ms
        max-attempts: 2
      clients:
        retry-client:
          socket-timeout: 400ms
          connect-timeout: 300ms
        isolated-timeout-client:
          socket-timeout: 300ms
          connect-timeout: 300ms
        custom-retry-client:
          retry:
            enabled: true
            period: 20ms
            max-period: 80ms
            max-attempts: 3
