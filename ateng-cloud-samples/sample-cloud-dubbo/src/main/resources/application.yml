server:
  port: 0

spring:
  application:
    name: sample-cloud-dubbo
  config:
    import:
      # 弹性探测本地真实服务配置文件；物理不存在时自动静默忽略，保障 CI 100% 离线自洽
      - "optional:classpath:application-local.yml"

dubbo:
  application:
    name: sample-cloud-dubbo
    register-mode: instance
  registry:
    address: N/A
  protocol:
    name: tri
    port: 50051
    serialization: fastjson2
  consumer:
    check: false
    scope: remote
  provider:
    timeout: 5000

ateng:
  boot:
    web:
      shutdown:
        enabled: false
  cloud:
    dubbo:
      enabled: true
      timeout: 5000ms
      retries: 0
