# 100% 离线自洽单测环境（零物理外部网络依赖）
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,nacos-service
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

ateng:
  cloud:
    nacos:
      drain-timeout: 20ms
