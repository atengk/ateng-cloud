server:
  port: 8080

spring:
  application:
    name: sample-cloud-nacos
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test}
  config:
    import:
      # 弹性探测本地真实配置文件；物理不存在时自动静默忽略，保障 CI 离线自洽
      - "optional:classpath:application-local.yml"
  cloud:
    nacos:
      discovery:
        enabled: false # 默认离线关闭外部物理发现连接，保障 CI 100% 离线自洽
      config:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,nacosService
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

ateng:
  boot:
    encrypt:
      enabled: true
  cloud:
    nacos:
      enabled: true
      zone: beijing-az1
      cluster: default-cluster
      metadata:
        startup-time: true
        warmup-duration: 60s
        version: 1.0.0
        custom:
          team: core-platform
      loadbalancer:
        zone-affinity: true
        warmup: true
        warmup-floor-weight-ratio: 0.10
        adaptive-weight:
          enabled: true
          min-floor-weight-ratio: 0.10
          medium-load-threshold: 0.70
          high-load-threshold: 0.85
          damping-ratio: 0.15
          sample-interval: 5s

demo:
  config:
    title: "Nacos Cloud Platform"
    secret-key: "ENC(ydS/bhIcoogPc1a6V/whVwUR54CsaUtyWWu9LgIZai9jksDqNO2g5yRaprANGUdt8biXgfIE)"
