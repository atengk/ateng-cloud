# ==============================================================================
# ateng-cloud 持久层 MyBatis-Plus 与多租户公共配置 (Data ID: common-mybatis.yaml)
# 所属环境: 全环境基线 (DEFAULT_GROUP)
# 适用范围: 引入了 ateng-boot-mybatis-plus 的业务微服务
# 治理生命周期说明:
#   - [只读-需重启]: 数据源连接池与 SqlSessionFactory
#   - [环境热绑-只读属性]: 租户白名单、批量批次大小等策略参数
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 默认数据源模板 (微服务节点可根据自身业务数据库在此覆盖或单独配置)
# ------------------------------------------------------------------------------
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:ateng_cloud}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:ateng}
    password: ${MYSQL_PASSWORD:YOUR_MYSQL_PASSWORD}
    hikari:
      pool-name: AtengHikariPool
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

# ------------------------------------------------------------------------------
# 2. MyBatis-Plus 原生全局与运行时配置 [只读-需重启]
# ------------------------------------------------------------------------------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: io.github.atengk.cloud.*.entity
  configuration:
    # 开启驼峰命名自动映射
    map-underscore-to-camel-case: true
    # 仅在开发环境打印 SQL 语句，生产环境由审计切面或慢 SQL 插件接管
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: "deleted"
      logic-delete-value: "1"
      logic-not-delete-value: "0"

# ------------------------------------------------------------------------------
# 3. ateng-boot-mybatis-plus 增强能力 (租户隔离、数据权限与批量插入) [环境热绑-只读属性]
# ------------------------------------------------------------------------------
ateng:
  boot:
    mybatis-plus:
      # 行级多租户隔离插件 (JSqlParser AST 自动拼接 WHERE tenant_id = ?)
      tenant:
        enabled: true
        column: "tenant_id"
        # 豁免租户隔离的全局系统字典表、公共配置表清单
        ignore-tables:
          - "sys_tenant"
          - "sys_dict_type"
          - "sys_dict_data"
          - "sys_config"
      # 细粒度声明式数据权限插件 (@DataScope)
      data-scope:
        enabled: true
      # 原生单条多值高性能批量插入引擎配置
      batch:
        batch-size: 1000
