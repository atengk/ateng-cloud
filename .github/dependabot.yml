# ==============================================================================
# Dependabot 依赖自动化更新配置 (Dependabot Version Updates)
#
# 💡 机制说明：
# 1. 本配置负责常规月度依赖升级（Version Updates），采用语义化双轨模型聚合 PR；
# 2. 针对高危 CVE 漏洞的即时修复（Dependabot Security Updates）由 GitHub 平台原生实时守护；
# 3. 严格遵循 ADR-0006 依赖基线锁定策略，全局阻断 Major 破坏性版本，锁定 Spring Boot 3.3.x。
# 详见: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuring-dependabot-version-updates
# ==============================================================================

version: 2
updates:
  # 持续监控 GitHub Actions 工作流版本更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
    ignore:
      # 全局屏蔽 GitHub Actions 的破坏性 Major 大版本更新
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 持续监控 Java / Maven 根工程与各子模块依赖
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
    ignore:
      # 1. 全局屏蔽所有 Maven 依赖与插件的 Major 破坏性大版本升级
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 2. 严格锁定 Spring Boot 在 3.3.x LTS 基线，禁止次版本与大版本升级 (对齐 ADR-0006)
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
